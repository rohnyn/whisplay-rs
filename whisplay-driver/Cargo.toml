[package]
name = "whisplay-driver"
description = "A Whisplay display client and Linux hardware daemon with image and GIF playback"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"

[features]
daemon = ["dep:gpio-cdev", "dep:spidev", "dep:signal-hook", "dep:image", "dep:gif", "dep:gif-dispose", "dep:bytemuck", "dep:fast_image_resize"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde-jsonlines = { version = "=0.7.0", default-features = false }
tempfile = "=3.19.1"
libc = "0.2"
gpio-cdev = { version = "=0.6.0", optional = true }
spidev = { version = "=0.6.0", optional = true }
signal-hook = { version = "0.3", optional = true }
image = { version = "=0.25.5", default-features = false, features = ["png", "jpeg"], optional = true }
gif = { version = "0.13", optional = true }
gif-dispose = { version = "=5.0.1", optional = true }
bytemuck = { version = "1", optional = true }
fast_image_resize = { version = "=5.1.4", default-features = false, optional = true }

[dev-dependencies]
serde_json = "1"
image = { version = "=0.25.5", default-features = false, features = ["gif"] }

[[bin]]
name = "whisplayd"
path = "src/bin/whisplayd/main.rs"
required-features = ["daemon"]

[[example]]
name = "playback_bench"
required-features = ["daemon"]
